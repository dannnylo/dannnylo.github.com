<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quebra cabeça</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #f0f0f0;
            margin: 20px;
        }
        canvas {
            border: 2px solid #333;
            border-radius: 8px;
            background: white;
            box-shadow: 0 0 10px #0002;
        }
        textarea {
            width: 80%;
            max-width: 600px;
            height: 100px;
            margin: 20px 0;
            padding: 10px;
            border: 2px solid #333;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #ee3333;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="btn btn-primary">Voltar</a>
    <h1>Mensagem estreita</h1>
    <textarea id="mensagem" placeholder="Digite sua mensagem secreta aqui..." oninput="gerarImagem()"></textarea><br>


    <button onclick="salvarImagem()">Salvar Imagem</button><br>
    <canvas id="canvas" width="800" height="1000"></canvas>
    <script>
        function gerarImagem() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            let mensagem = document.getElementById('mensagem').value;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const fontSize = 200; // Very tall font size
            ctx.font = `${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const xStart = canvas.width / 2 - (mensagem.length * fontSize * 0.1); // Adjust starting position
            const y = canvas.height / 2 + 80;

            ctx.fillStyle = '#000';
            let x = xStart;
            for (let i = 0; i < mensagem.length; i++) {
                const char = mensagem[i];
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(0.2, 5); // Narrow the text horizontally and increase height
                ctx.fillText(char, 0, 0);
                ctx.restore();
                x += fontSize * 0.2; // Adjust spacing for narrow letters
            }
        }


        function salvarImagem() {
            try {
                const link = document.createElement('a');
                link.download = `mensagem_secreta_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL();
                link.click();
            } catch(e) {
                console.error('Erro:', e);
                alert('Erro ao salvar imagem');
            }
        }

        // Gera imagem inicial
        window.onload = gerarImagem;
    </script>
</body>
</html>
