<style>

:#7b886e;font-variant-numeric:tabular-nums}.card-name{font-size:clamp(26px,3.5vw,40px);line-height:1.15;margin:18px 0;overflow-wrap:anywhere}.structure-icon{width:66px;height:66px;background:#e6edda;color:#6e8b54;display:grid;place-items:center;border-radius:18px;font-size:35px;margin:14px 0}.function{font-size:20px;line-height:1.6;max-width:750px}.cue{background:#edf3e4;border-radius:10px;padding:16px;margin:18px 0}.cue p{margin:6px 0 0;font-size:16px}.label{font-size:10px;font-weight:750;letter-spacing:1.5px;color:#6c815a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.navigation{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid #dce4d4}.muted{color:#79876e}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.answers button{min-height:70px;text-align:left;line-height:1.4}.answers .correct{background:#dfedd3;border:2px solid #547d3f;color:#274220;opacity:1}.answers .wrong{background:#f8e5dc;border:2px solid #a65338;color:#6b321f;opacity:1}.feedback{min-height:28px;margin-top:18px;font-size:17px;line-height:1.5}.result-number{font-size:64px;font-weight:750;letter-spacing:-3px;color:#5c7e47}.note{font-size:12px;color:#78846d;max-width:1000px;margin:22px 0 0}.saved{font-size:12px;color:#74846a}.activity h2:focus{outline:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{order:2}#parts{display:grid;grid-template-columns:1fr 1fr}.activity{min-height:400px}.function{font-size:18px}}@media(max-width:520px){header{font-size:13px;padding:14px 18px}header label>span{display:none}main{padding:22px 18px}.answers{grid-template-columns:1fr}.toolbar{align-items:flex-start}.modes button{font-size:14px;padding:10px}.activity{padding:22px}.navigation button{padding:10px;font-size:14px}.card-name{font-size:27px}#parts{grid-template-columns:1fr}}

<body><header><a href="./" data-text="back">← Back to the game</a><label><span data-text="language">Language</span><select id="language" aria-label="Language"><option value="en">English</option><option value="pt">Português</option></select></label></header>
<main><div class="eyebrow" data-text="eyebrow">CELL LAB · STUDY AND PRACTICE</div><h1 data-text="heading">Get to know the cell.</h1><p class="intro" data-text="intro">Learn the function, make an association and test your memory.</p>
<div class="toolbar"><div class="modes"><button id="study-mode" data-text="study" aria-pressed="true">Study cards</button><button id="quiz-mode" data-text="quiz" aria-pressed="false">Test your memory</button></div><label><span data-text="filter">Structures in</span><select id="filter"><option value="all" data-text="all">All</option><option value="animal" data-text="animal">Animal cell</option><option value="plant" data-text="plant">Plant cell</option></select></label></div>
<div class="layout"><aside class="sidebar"><h2 data-text="parts">PARTS OF THE CELL</h2><p class="progress" id="progress-text"></p><progress id="progress" max="12" value="0" aria-label="Memorized"></progress><nav id="parts"></nav><p class="saved" data-text="saved">Your study progress is saved in this browser.</p></aside><section class="activity" id="activity" aria-label="Study activity"></section></div><p class="note" data-text="scope"></p></main>
<script>
const PARTS = [
  {
    "id": "membrane",
    "type": "both",
    "pt": {
      "name": "Membrana plasmática",
      "function": "Controla a entrada e a saída de substâncias e delimita a célula.",
      "hint": "Pense em uma portaria com entrada controlada."
    },
    "en": {
      "name": "Cell membrane",
      "function": "Controls what enters and leaves the cell and forms its boundary.",
      "hint": "Think of a gate with controlled entry."
    }
  },
  {
    "id": "cytoplasm",
    "type": "both",
    "pt": {
      "name": "Citoplasma",
      "function": "Região entre a membrana e o núcleo, com citosol e estruturas celulares; abriga muitas reações químicas.",
      "hint": "É o ambiente de trabalho dentro da célula."
    },
    "en": {
      "name": "Cytoplasm",
      "function": "The region between the membrane and nucleus, containing cytosol and cellular structures; many chemical reactions occur here.",
      "hint": "It is the workspace inside the cell."
    }
  },
  {
    "id": "nucleus",
    "type": "both",
    "pt": {
      "name": "Núcleo",
      "function": "Abriga a maior parte do DNA da célula e participa do controle da expressão dos genes.",
      "hint": "Pense em uma biblioteca de instruções."
    },
    "en": {
      "name": "Nucleus",
      "function": "Houses most of the cell’s DNA and helps regulate gene expression.",
      "hint": "Think of a library of instructions."
    }
  },
  {
    "id": "mitochondria",
    "type": "both",
    "pt": {
      "name": "Mitocôndria",
      "function": "Produz grande parte do ATP durante a respiração celular aeróbica.",
      "hint": "ATP é uma fonte de energia para processos celulares."
    },
    "en": {
      "name": "Mitochondrion",
      "function": "Produces much of the cell’s ATP during aerobic cellular respiration.",
      "hint": "ATP supplies energy for cellular processes."
    }
  },
  {
    "id": "ribosome",
    "type": "both",
    "pt": {
      "name": "Ribossomo",
      "function": "Sintetiza proteínas, unindo aminoácidos conforme a informação do RNA mensageiro.",
      "hint": "Pense em uma máquina de montar proteínas."
    },
    "en": {
      "name": "Ribosome",
      "function": "Builds proteins by joining amino acids according to messenger RNA instructions.",
      "hint": "Think of a protein assembly machine."
    }
  },
  {
    "id": "rough-er",
    "type": "both",
    "pt": {
      "name": "Retículo endoplasmático rugoso",
      "function": "Com ribossomos associados, participa da produção e do processamento de proteínas destinadas à secreção e a membranas.",
      "hint": "Rugoso = ribossomos na superfície."
    },
    "en": {
      "name": "Rough endoplasmic reticulum",
      "function": "With attached ribosomes, helps produce and process proteins destined for secretion and membranes.",
      "hint": "Rough = ribosomes on the surface."
    }
  },
  {
    "id": "smooth-er",
    "type": "both",
    "pt": {
      "name": "Retículo endoplasmático liso",
      "function": "Participa da síntese de lipídios, da desintoxicação e do armazenamento de cálcio, dependendo da célula.",
      "hint": "Liso lembra lipídios; não tem ribossomos aderidos."
    },
    "en": {
      "name": "Smooth endoplasmic reticulum",
      "function": "Helps synthesize lipids, detoxify substances and store calcium, depending on the cell.",
      "hint": "Smooth means no attached ribosomes; remember lipids."
    }
  },
  {
    "id": "golgi",
    "type": "both",
    "pt": {
      "name": "Complexo de Golgi",
      "function": "Modifica, organiza e encaminha proteínas e lipídios em vesículas para seus destinos.",
      "hint": "Pense em um centro de embalagem e distribuição."
    },
    "en": {
      "name": "Golgi apparatus",
      "function": "Modifies, sorts and sends proteins and lipids to their destinations in vesicles.",
      "hint": "Think of a packaging and distribution center."
    }
  },
  {
    "id": "lysosome",
    "type": "animal",
    "pt": {
      "name": "Lisossomo",
      "function": "Contém enzimas que digerem materiais e ajudam a reciclar componentes celulares.",
      "hint": "Pense em uma central de digestão e reciclagem."
    },
    "en": {
      "name": "Lysosome",
      "function": "Contains enzymes that digest materials and help recycle cellular components.",
      "hint": "Think of a digestion and recycling center."
    }
  },
  {
    "id": "vacuole",
    "type": "plant",
    "pt": {
      "name": "Vacúolo central",
      "function": "Armazena água e outras substâncias e ajuda a manter a pressão de turgor na célula vegetal.",
      "hint": "Pense em um reservatório que também ajuda na sustentação."
    },
    "en": {
      "name": "Central vacuole",
      "function": "Stores water and other substances and helps maintain turgor pressure in plant cells.",
      "hint": "Think of a reservoir that also helps keep the cell firm."
    }
  },
  {
    "id": "chloroplast",
    "type": "plant",
    "pt": {
      "name": "Cloroplasto",
      "function": "Realiza a fotossíntese, convertendo energia luminosa em energia química usada na produção de açúcares.",
      "hint": "Pense em uma fábrica de açúcares movida a luz."
    },
    "en": {
      "name": "Chloroplast",
      "function": "Performs photosynthesis, converting light energy into chemical energy used to make sugars.",
      "hint": "Think of a light-powered sugar factory."
    }
  },
  {
    "id": "wall",
    "type": "plant",
    "pt": {
      "name": "Parede celular",
      "function": "Camada externa à membrana que oferece proteção e sustentação; nas plantas, contém celulose.",
      "hint": "Pense em uma estrutura firme por fora da membrana."
    },
    "en": {
      "name": "Cell wall",
      "function": "A layer outside the membrane that provides protection and support; in plants, it contains cellulose.",
      "hint": "Think of a firm supporting layer outside the membrane."
    }
  }
];
const TEXT = {
  "pt": {
    "title": "Cell Lab — Partes da célula",
    "back": "← Voltar ao jogo",
    "language": "Idioma",
    "eyebrow": "CELL LAB · ESTUDE E PRATIQUE",
    "heading": "Conheça a célula por dentro.",
    "intro": "Aprenda a função, crie uma associação e teste sua memória.",
    "study": "Cartões de estudo",
    "quiz": "Testar memória",
    "filter": "Estruturas de",
    "all": "Todas",
    "animal": "Célula animal",
    "plant": "Célula vegetal",
    "parts": "PARTES DA CÉLULA",
    "progress": "memorizadas",
    "reveal": "Revelar função",
    "hide": "Ocultar função",
    "known": "Já memorizei",
    "unmark": "Revisar novamente",
    "previous": "← Anterior",
    "next": "Próximo →",
    "think": "Tente lembrar a função antes de revelar a resposta.",
    "function": "O QUE FAZ",
    "hint": "PARA LEMBRAR",
    "question": "Qual estrutura realiza esta função?",
    "correct": "Acertou!",
    "wrong": "Quase! A resposta correta é:",
    "nextQuestion": "Próxima pergunta →",
    "finish": "Ver resultado →",
    "result": "Revisão concluída!",
    "score": "acertos",
    "retry": "Refazer quiz",
    "review": "Revisar erros",
    "perfect": "Você acertou todas! Volte mais tarde para treinar novamente.",
    "keep": "Revise as estruturas que você errou e tente outra vez.",
    "scope": "Modelo de células eucarióticas típicas: nem toda célula possui todas estas estruturas. Cloroplastos ocorrem em células vegetais fotossintéticas; vacúolos líticos desempenham funções digestivas em plantas. As associações são recursos de memória, não definições completas.",
    "saved": "Seu progresso de estudo fica salvo neste navegador.",
    "empty": "Nenhum erro para revisar.",
    "counter": "de"
  },
  "en": {
    "title": "Cell Lab — Cell parts",
    "back": "← Back to the game",
    "language": "Language",
    "eyebrow": "CELL LAB · STUDY AND PRACTICE",
    "heading": "Get to know the cell.",
    "intro": "Learn the function, make an association and test your memory.",
    "study": "Study cards",
    "quiz": "Test your memory",
    "filter": "Structures in",
    "all": "All",
    "animal": "Animal cell",
    "plant": "Plant cell",
    "parts": "PARTS OF THE CELL",
    "progress": "memorized",
    "reveal": "Reveal function",
    "hide": "Hide function",
    "known": "I remember this",
    "unmark": "Review again",
    "previous": "← Previous",
    "next": "Next →",
    "think": "Try to recall the function before revealing the answer.",
    "function": "WHAT IT DOES",
    "hint": "MEMORY CUE",
    "question": "Which structure performs this function?",
    "correct": "Correct!",
    "wrong": "Almost! The correct answer is:",
    "nextQuestion": "Next question →",
    "finish": "See results →",
    "result": "Review complete!",
    "score": "correct",
    "retry": "Try the quiz again",
    "review": "Review mistakes",
    "perfect": "You got them all! Come back later to practice again.",
    "keep": "Review the structures you missed and try again.",
    "scope": "Model of typical eukaryotic cells: not every cell contains all these structures. Chloroplasts occur in photosynthetic plant cells; lytic vacuoles perform digestive functions in plants. Memory cues are learning aids, not complete definitions.",
    "saved": "Your study progress is saved in this browser.",
    "empty": "No mistakes to review.",
    "counter": "of"
  }
};
let lang='en', known=new Set();
try { if(localStorage.getItem('biomerge-language')==='pt')lang='pt'; const saved=JSON.parse(localStorage.getItem('biomerge-cell-known')||'[]'); if(Array.isArray(saved))known=new Set(saved.filter(id=>PARTS.some(part=>part.id===id))); } catch {}
let mode='study', filter='all', cardIndex=0, revealed=false, questions=[], questionIndex=0, chosen=null, correctCount=0, mistakes=[], finished=false;
const $=selector=>document.querySelector(selector), tr=key=>TEXT[lang][key], detail=part=>part[lang];
function pool(){return PARTS.filter(part=>filter==='all'||part.type==='both'||part.type===filter);}
function shuffled(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
function startQuiz(ids){const eligible=pool();questions=shuffled(ids?eligible.filter(p=>ids.includes(p.id)):eligible).map(part=>({part,options:shuffled([part,...shuffled(eligible.filter(p=>p.id!==part.id)).slice(0,3)])}));if(!questions.length)return;mode='quiz';questionIndex=0;chosen=null;correctCount=0;mistakes=[];finished=false;render();}
function choose(id){if(mode!=='quiz'||finished||chosen!==null)return;const question=questions[questionIndex];if(!question.options.some(part=>part.id===id))return;chosen=id;if(id===question.part.id)correctCount++;else mistakes.push(question.part.id);render();$('#advance').focus();}
function advance(){if(chosen===null)return;if(questionIndex+1===questions.length)finished=true;else{questionIndex++;chosen=null;}render();$('#activity h2').focus();}
function setLanguage(value){lang=value==='pt'?'pt':'en';try{localStorage.setItem('biomerge-language',lang);}catch{}render();}
function mark(){const id=pool()[cardIndex].id;if(known.has(id))known.delete(id);else known.add(id);try{localStorage.setItem('biomerge-cell-known',JSON.stringify([...known]));}catch{}render();($('#mark')||$('#reveal')).focus();}
function moveCard(step){cardIndex=(cardIndex+step+pool().length)%pool().length;revealed=false;render();$('#activity h2').focus();}
function cardView(){const part=pool()[cardIndex],d=detail(part);return `<span class="counter">${cardIndex+1} ${tr('counter')} ${pool().length}</span><div class="structure-icon" aria-hidden="true">✳</div><h2 class="card-name" tabindex="-1">${d.name}</h2>${revealed?`<span class="label">${tr('function')}</span><p class="function">${d.function}</p><div class="cue"><span class="label">${tr('hint')}</span><p>${d.hint}</p></div>`:`<p class="muted">${tr('think')}</p>`}<div class="actions"><button class="primary" id="reveal" aria-expanded="${revealed}">${tr(revealed?'hide':'reveal')}</button>${revealed||known.has(part.id)?`<button id="mark" aria-pressed="${known.has(part.id)}">${tr(known.has(part.id)?'unmark':'known')}</button>`:''}</div><div class="navigation"><button id="previous">${tr('previous')}</button><button id="next">${tr('next')}</button></div>`;}
function quizView(){if(finished)return `<span class="eyebrow">${tr('quiz')}</span><h2 class="card-name" tabindex="-1">${tr('result')}</h2><div class="result-number">${correctCount} / ${questions.length}</div><span>${tr('score')}</span><p>${tr(mistakes.length?'keep':'perfect')}</p><div class="actions"><button id="retry" class="primary">${tr('retry')}</button>${mistakes.length?`<button id="review">${tr('review')}</button>`:''}<button id="back-study">${tr('study')}</button></div>`;
const q=questions[questionIndex],d=detail(q.part);return `<span class="counter">${questionIndex+1} ${tr('counter')} ${questions.length}</span><h2 tabindex="-1">${tr('question')}</h2><p class="function">${d.function}</p><div class="answers">${q.options.map(part=>`<button data-answer="${part.id}" ${chosen!==null?'disabled':''} class="${chosen!==null&&part.id===q.part.id?'correct':chosen===part.id?'wrong':''}">${detail(part).name}</button>`).join('')}</div><div class="feedback" role="status">${chosen===null?'':chosen===q.part.id?tr('correct'):tr('wrong')+' '+d.name}</div>${chosen!==null?`<div class="cue"><span class="label">${tr('hint')}</span><p>${d.hint}</p></div><div class="actions"><button id="advance" class="primary">${tr(questionIndex+1===questions.length?'finish':'nextQuestion')}</button></div>`:''}`;}
function render(){document.documentElement.lang=lang==='pt'?'pt-BR':'en';document.title=tr('title');document.querySelectorAll('[data-text]').forEach(el=>el.textContent=tr(el.dataset.text));$('#language').value=lang;$('#language').setAttribute('aria-label',tr('language'));$('#activity').setAttribute('aria-label',tr(mode==='study'?'study':'quiz'));const eligible=pool(),count=eligible.filter(p=>known.has(p.id)).length;$('#progress-text').textContent=`${count} / ${eligible.length} ${tr('progress')}`;$('#progress').max=eligible.length;$('#progress').value=count;$('#progress').setAttribute('aria-label',tr('progress'));
$('#parts').innerHTML=eligible.map((p,i)=>`<button data-card="${i}" ${mode==='study'&&cardIndex===i?'aria-current="true" class="selected"':''}><span>${detail(p).name}</span><span aria-label="${known.has(p.id)?tr('known'):tr('unmark')}">${known.has(p.id)?'✓':'·'}</span></button>`).join('');for(const m of ['study','quiz']){$('#'+m+'-mode').classList.toggle('selected',mode===m);$('#'+m+'-mode').setAttribute('aria-pressed',String(mode===m));}$('#activity').innerHTML=mode==='study'?cardView():quizView();}
$('#language').addEventListener('change',e=>setLanguage(e.target.value));$('#filter').addEventListener('change',e=>{filter=e.target.value;cardIndex=0;revealed=false;if(mode==='quiz')startQuiz();else render();});$('#study-mode').addEventListener('click',()=>{mode='study';render();});$('#quiz-mode').addEventListener('click',()=>{if(mode!=='quiz')startQuiz();});
$('#parts').addEventListener('click',e=>{const button=e.target.closest('[data-card]');if(!button)return;cardIndex=Number(button.dataset.card);mode='study';revealed=false;render();$('#activity h2').focus();});
$('#activity').addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.answer){choose(button.dataset.answer);return;}switch(button.id){case'reveal':revealed=!revealed;render();$('#reveal').focus();break;case'mark':mark();break;case'previous':moveCard(-1);break;case'next':moveCard(1);break;case'advance':advance();break;case'retry':startQuiz();break;case'review':startQuiz([...mistakes]);break;case'back-study':mode='study';render();break;}});
render();
</script></body></html>
