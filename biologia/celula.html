 parts+=diagramPart('smooth-er','<path class="organ" d="M186 106q27-22 53 0t47 0m-106 20q31-19 55 0t49 0m-96 20q27-17 55 0t46 0" fill="none" stroke="#d5a883" stroke-width="8" stroke-linecap="round"/>',234,118);
 const gx=plant?181:355;
 parts+=diagramPart('golgi',`<g class="organ" fill="none" stroke="#c98d9a" stroke-width="9" stroke-linecap="round"><path d="M${gx} 296q42-29 84 0m-80 15q38-24 76 0m-69 15q31-19 62 0m-54 15q23-14 46 0"/></g>`,gx+41,306);
 const mx=plant?386:436,my=plant?94:158;
 parts+=diagramPart('mitochondria',`<g transform="translate(${mx} ${my}) rotate(-22)"><rect class="organ" x="-44" y="-20" width="88" height="40" rx="21" fill="#efc192" stroke="#bc8654" stroke-width="3"/><path d="M-29 2l9-12 10 20 10-20 10 20 12-20 8 12" fill="none" stroke="#b27945" stroke-width="3" pointer-events="none"/></g>`,mx,my);
 parts+=diagramPart('ribosome','<g class="organ" fill="#536e8c"><circle cx="318" cy="365" r="24" fill="transparent"/><circle cx="306" cy="356" r="5"/><circle cx="328" cy="357" r="5"/><circle cx="301" cy="375" r="5"/><circle cx="333" cy="375" r="5"/></g>',318,365);
 if(plant)parts+=diagramPart('chloroplast','<g transform="translate(110 331) rotate(-25)"><ellipse class="organ" rx="46" ry="24" fill="#a9ce87" stroke="#638c49" stroke-width="3"/><path d="M-26-11v22m8-22v22m10-22v22m13-22v22m10-22v22m9-22v22" stroke="#638c49" stroke-width="4" pointer-events="none"/></g>',110,331);
 else parts+=diagramPart('lysosome','<circle class="organ" cx="453" cy="263" r="31" fill="#edcd91" stroke="#b99550" stroke-width="3"/><g fill="#b99550" pointer-events="none"><circle cx="439" cy="254" r="3"/><circle cx="465" cy="271" r="4"/><circle cx="449" cy="279" r="3"/></g>',453,263);
 return `<svg class="cell-drawing" viewBox="0 0 640 460" role="group" aria-label="${tr('diagramLabel')}">${parts}</svg>`;
}
function renderDiagram(){
 $('#diagram').hidden=mode!=='study'&&mode!=='image';
 $('.layout').classList.toggle('quiz-layout',mode==='quiz');
 if(mode!=='study'&&mode!=='image')return;
 const type=filter==='all'?diagramType:filter;
 $('#diagram').innerHTML=`${filter==='all'?`<div class="diagram-tabs"><button data-diagram="animal" aria-pressed="${type==='animal'}" class="${type==='animal'?'selected':''}">${tr('animal')}</button><button data-diagram="plant" aria-pressed="${type==='plant'}" class="${type==='plant'?'selected':''}">${tr('plant')}</button></div>`:''}<h2>${tr(type==='plant'?'diagramPlant':'diagramAnimal')}</h2><p class="diagram-instruction">${tr(mode==='image'?'imagePrompt':'diagramHint')}</p>${cellDiagram(type)}<p class="diagram-note">${tr('diagramNote')}</p>`;
}
function shuffled(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
function startQuiz(ids){const eligible=pool();questions=shuffled(ids?eligible.filter(p=>ids.includes(p.id)):eligible).map(part=>({part,options:shuffled([part,...shuffled(eligible.filter(p=>p.id!==part.id)).slice(0,3)])}));if(!questions.length)return;mode='quiz';questionIndex=0;chosen=null;correctCount=0;mistakes=[];finished=false;render();}
function choose(id){if(mode!=='quiz'||finished||chosen!==null)return;const question=questions[questionIndex];if(!question.options.some(part=>part.id===id))return;chosen=id;if(id===question.part.id)correctCount++;else mistakes.push(question.part.id);render();$('#advance').focus();}
function startImageGame(){
 const type=filter==='all'?diagramType:filter;
 const eligible=PARTS.filter(part=>part.type==='both'||part.type===type);
 questions=shuffled(eligible).map(part=>({part}));
 mode='image';questionIndex=0;chosen=null;correctCount=0;mistakes=[];finished=false;
 render();
}
function startImageReview(){const ids=[...new Set(mistakes)];if(!ids.length)return;const type=filter==='all'?diagramType:filter;questions=shuffled(PARTS.filter(part=>ids.includes(part.id)&&(part.type==='both'||part.type===type))).map(part=>({part}));mode='image';questionIndex=0;chosen=null;correctCount=0;mistakes=[];finished=false;render();}
function chooseImagePart(id){
 if(mode!=='image'||finished||chosen!==null)return;
 const part=PARTS.find(item=>item.id===id);
 if(!part||!questions[questionIndex].part)return;
 chosen=id;
 if(id===questions[questionIndex].part.id)correctCount++;else mistakes.push(questions[questionIndex].part.id);
 render();$('#image-advance').focus();
}
function advance(){if(chosen===null)return;if(questionIndex+1===questions.length)finished=true;else{questionIndex++;chosen=null;}render();$('#activity h2').focus();}
function setLanguage(value){lang=value==='pt'?'pt':'en';try{localStorage.setItem('biomerge-language',lang);}catch{}render();}
function mark(){const id=pool()[cardIndex].id;if(known.has(id))known.delete(id);else known.add(id);try{localStorage.setItem('biomerge-cell-known',JSON.stringify([...known]));}catch{}render();($('#mark')||$('#reveal')).focus();}
function moveCard(step){cardIndex=(cardIndex+step+pool().length)%pool().length;if(pool()[cardIndex].type!=='both')diagramType=pool()[cardIndex].type;revealed=false;render();$('#activity h2').focus();}
function cardView(){const part=pool()[cardIndex],d=detail(part);return `<span class="counter">${cardIndex+1} ${tr('counter')} ${pool().length}</span><div class="structure-icon" aria-hidden="true">✳</div><h2 class="card-name" tabindex="-1">${d.name}</h2>${revealed?`<span class="label">${tr('function')}</span><p class="function">${d.function}</p><div class="cue"><span class="label">${tr('hint')}</span><p>${d.hint}</p></div>`:`<p class="muted">${tr('think')}</p>`}<div class="actions"><button class="primary" id="reveal" aria-expanded="${revealed}">${tr(revealed?'hide':'reveal')}</button>${revealed||known.has(part.id)?`<button id="mark" aria-pressed="${known.has(part.id)}">${tr(known.has(part.id)?'unmark':'known')}</button>`:''}</div><div class="navigation"><button id="previous">${tr('previous')}</button><button id="next">${tr('next')}</button></div>`;}
function imageGameView(){
 if(finished)return `<span class="eyebrow">${tr('imageGame')}</span><h2 class="card-name" tabindex="-1">${tr('result')}</h2><div class="result-number">${correctCount} / ${questions.length}</div><span>${tr('score')}</span><p>${tr(mistakes.length?'keep':'perfect')}</p><div class="actions"><button id="image-retry" class="primary">${tr('retry')}</button>${mistakes.length?`<button id="image-review">${tr('review')}</button>`:''}<button id="back-study">${tr('study')}</button></div>`;
 const q=questions[questionIndex],d=detail(q.part);
 return `<span class="counter">${questionIndex+1} ${tr('counter')} ${questions.length}</span><h2 class="card-name" tabindex="-1">${tr('imageGame')}</h2><span class="label">${tr('function')}</span><p class="function">${d.function}</p><p class="diagram-instruction">${tr('imagePrompt')}</p><div class="feedback" role="status">${chosen===null?'':chosen===q.part.id?tr('imageCorrect'):tr('imageWrong')}</div>${chosen!==null?`<div class="cue"><span class="label">${tr('hint')}</span><p>${d.hint}</p></div><div class="actions"><button id="image-advance" class="primary">${tr(questionIndex+1===questions.length?'imageFinish':'imageNext')}</button></div>`:''}`;
}
function quizView(){if(finished)return `<span class="eyebrow">${tr('quiz')}</span><h2 class="card-name" tabindex="-1">${tr('result')}</h2><div class="result-number">${correctCount} / ${questions.length}</div><span>${tr('score')}</span><p>${tr(mistakes.length?'keep':'perfect')}</p><div class="actions"><button id="retry" class="primary">${tr('retry')}</button>${mistakes.length?`<button id="review">${tr('review')}</button>`:''}<button id="back-study">${tr('study')}</button></div>`;
const q=questions[questionIndex],d=detail(q.part);return `<span class="counter">${questionIndex+1} ${tr('counter')} ${questions.length}</span><h2 tabindex="-1">${tr('question')}</h2><p class="function">${d.function}</p><div class="answers">${q.options.map(part=>`<button data-answer="${part.id}" ${chosen!==null?'disabled':''} class="${chosen!==null&&part.id===q.part.id?'correct':chosen===part.id?'wrong':''}">${detail(part).name}</button>`).join('')}</div><div class="feedback" role="status">${chosen===null?'':chosen===q.part.id?tr('correct'):tr('wrong')+' '+d.name}</div>${chosen!==null?`<div class="cue"><span class="label">${tr('hint')}</span><p>${d.hint}</p></div><div class="actions"><button id="advance" class="primary">${tr(questionIndex+1===questions.length?'finish':'nextQuestion')}</button></div>`:''}`;}
function render(){document.documentElement.lang=lang==='pt'?'pt-BR':'en';document.title=tr('title');document.querySelectorAll('[data-text]').forEach(el=>el.textContent=tr(el.dataset.text));$('#language').value=lang;$('#language').setAttribute('aria-label',tr('language'));$('#activity').setAttribute('aria-label',tr(mode==='study'?'study':mode==='image'?'imageGameLabel':'quiz'));const eligible=pool(),count=eligible.filter(p=>known.has(p.id)).length;$('#progress-text').textContent=`${count} / ${eligible.length} ${tr('progress')}`;$('#progress').max=eligible.length;$('#progress').value=count;$('#progress').setAttribute('aria-label',tr('progress'));
$('#parts').innerHTML=eligible.map((p,i)=>`<button data-card="${i}" ${mode==='study'&&cardIndex===i?'aria-current="true" class="selected"':''}><span>${PARTS.indexOf(p)+1}. ${detail(p).name}</span><span class="part-status">${p.core?tr('coreLabel'):tr('extraLabel')} ${known.has(p.id)?'✓':''}</span></button>`).join('');for(const m of ['study','quiz','image-game']){$('#'+m+'-mode').classList.toggle('selected',mode===m);$('#'+m+'-mode').setAttribute('aria-pressed',String(mode===m));}$('#activity').innerHTML=mode==='study'?cardView():mode==='image'?imageGameView():quizView();renderDiagram();}
$('#diagram').addEventListener('click',e=>{
 const part=e.target.closest('[data-part]');
 if(part){selectPart(part.dataset.part);return;}
 const tab=e.target.closest('[data-diagram]');
 if(tab){diagramType=tab.dataset.diagram;if(mode==='image'){startImageGame();return;}const selected=pool()[cardIndex];if(selected.type!=='both'&&selected.type!==diagramType){cardIndex=pool().findIndex(p=>p.id==='nucleus');revealed=true;}render();}
});
$('#diagram').addEventListener('keydown',e=>{const part=e.target.closest('[data-part]');if(part&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectPart(part.dataset.part);}});
$('#language').addEventListener('change' ,e=>setLanguage(e.target.value));$('#filter').addEventListener('change',e=>{filter=e.target.value;cardIndex=0;revealed=false;if(mode==='quiz')startQuiz();else if(mode==='image')startImageGame();else render();});$('#study-mode').addEventListener('click',()=>{mode='study';render();});$('#quiz-mode').addEventListener('click',()=>{if(mode!=='quiz')startQuiz();});$('#image-game-mode').addEventListener('click',()=>{if(mode!=='image')startImageGame();});
$('#parts').addEventListener('click',e=>{const button=e.target.closest('[data-card]');if(!button)return;selectPart(pool()[Number(button.dataset.card)].id);});
$('#activity').addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.answer){choose(button.dataset.answer);return;}switch(button.id){case'reveal':revealed=!revealed;render();$('#reveal').focus();break;case'mark':mark();break;case'previous':moveCard(-1);break;case'next':moveCard(1);break;case'advance':advance();break;case'image-advance':if(chosen!==null){if(questionIndex+1===questions.length)finished=true;else{questionIndex++;chosen=null;}render();$('#activity h2').focus();}break;case'image-retry':startImageGame();break;case'image-review':startImageReview();break;case'retry':startQuiz();break;case'review':startQuiz([...mistakes]);break;case'back-study':mode='study';render();break;}});
render();
</script></body></html>
